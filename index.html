<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nydur XP Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
header{padding:22px;background:#151c32;border-bottom:1px solid #293451}header h1{margin:0;color:#7c9cff;font-size:25px}header p{color:#aab5d0;margin-bottom:0}
main{max-width:900px;margin:auto;padding:20px}.card{background:#151c32;border:1px solid #293451;border-radius:12px;padding:18px;margin-bottom:18px}
h2{font-size:19px;margin-top:0}select,input,button{width:100%;padding:13px;margin-top:10px;border-radius:8px;border:1px solid #34415f;background:#0b1020;color:white;font-size:15px}
button{background:#526fff;border:0;font-weight:bold;cursor:pointer}.stat{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #293451}.stat:last-child{border-bottom:0}.value{color:#7c9cff;font-weight:bold;text-align:right}
.notice{color:#aab5d0;font-size:13px;line-height:1.5}.player{padding:12px;border-bottom:1px solid #293451}.player:last-child{border:0}.player strong{display:block;margin-bottom:5px}.small{color:#aab5d0;font-size:13px}
footer{text-align:center;padding:20px;color:#75809c;font-size:12px}
</style>
</head>
<body>
<header><h1>⚔ NYDUR XP TRACKER</h1><p>Ranking e acompanhamento de experiência</p></header>
<main>
<section class="card">
<h2>🏆 Ranking atual</h2>
<select id="categoria" aria-label="Categoria">
<option value="level">XP Level</option><option value="magic">Magia</option><option value="strength">Força</option><option value="pally">Paladino</option><option value="defense">Defesa</option>
</select>
<div id="atualizacao" class="notice">Carregando dados...</div>
<div id="ranking"></div>
</section>
<section class="card">
<h2>🔎 Pesquisar jogador</h2>
<input id="jogador" type="search" placeholder="Digite o nome do jogador">
<button id="buscar">Pesquisar</button><div id="resultado"></div>
</section>
<section class="card">
<h2>📊 Ranking diário / semanal / mensal</h2>
<select id="periodo"><option value="daily">Diário</option><option value="weekly">Semanal</option><option value="monthly">Mensal</option></select>
<div id="periodoInfo" class="notice">O ranking diário, semanal e mensal depende do histórico de coletas. Esta página mostra o ranking atual oficial coletado.</div>
</section>
</main>
<footer>Nydur XP Tracker</footer>
<script>
const nomesCategorias={level:"XP Level",magic:"Magia",strength:"Força",pally:"Paladino",defense:"Defesa"};
let dados=null;
const fmt=n=>Number(n||0).toLocaleString("pt-BR");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function jogadoresTodos(){if(!dados?.categorias)return [];return Object.entries(dados.categorias).flatMap(([cat,obj])=>(obj.jogadores||[]).map(p=>({...p,categoria:cat,nomeCategoria:obj.nome||nomesCategorias[cat]||cat})));}
function renderRanking(){
 const cat=document.getElementById("categoria").value, obj=dados?.categorias?.[cat], el=document.getElementById("ranking");
 if(!obj){el.innerHTML='<p class="notice">Dados desta categoria não encontrados.</p>';return;}
 const jogadores=obj.jogadores||[];
 el.innerHTML=jogadores.map((p,i)=>'<div class="player"><strong>#'+esc(p.posicao??i+1)+' '+esc(p.nome)+'</strong><div class="small">Nível: '+fmt(p.level)+' · XP: '+fmt(p.xp)+'</div></div>').join("");
}
function pesquisar(){
 const q=document.getElementById("jogador").value.trim().toLocaleLowerCase("pt-BR"),el=document.getElementById("resultado");
 if(!q){el.innerHTML='<p class="notice">Digite o nome do jogador.</p>';return;}
 const found=jogadoresTodos().filter(p=>p.nome.toLocaleLowerCase("pt-BR").includes(q));
 el.innerHTML=found.length?found.map(p=>'<div class="player"><strong>'+esc(p.nome)+' · '+esc(p.nomeCategoria)+'</strong><div class="small">Posição: #'+fmt(p.posicao)+' · Nível: '+fmt(p.level)+' · XP: '+fmt(p.xp)+'</div></div>').join(""):'<p class="notice">Jogador não encontrado nos rankings coletados.</p>';
}
async function carregar(){
 try{
 const res=await fetch("ranking_atual.json?ts="+Date.now(),{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);
 dados=await res.json();renderRanking();
 const dt=dados.data?new Date(dados.data):null;
 document.getElementById("atualizacao").textContent="Última coleta: "+(dt&&!isNaN(dt)?dt.toLocaleString("pt-BR"):"data registrada no arquivo")+". Jogadores: "+jogadoresTodos().length+" / 250.";
 }catch(e){document.getElementById("atualizacao").textContent="Não foi possível carregar ranking_atual.json. "+e.message;document.getElementById("ranking").innerHTML="";}
}
document.getElementById("categoria").addEventListener("change",renderRanking);
document.getElementById("buscar").addEventListener("click",pesquisar);
document.getElementById("jogador").addEventListener("keydown",e=>{if(e.key==="Enter")pesquisar();});
document.getElementById("periodo").addEventListener("change",e=>{document.getElementById("periodoInfo").textContent=e.target.value==="daily"?"O ranking diário será exibido quando o histórico de XP por jogador estiver disponível.":e.target.value==="weekly"?"O ranking semanal requer histórico acumulado das coletas.":"O ranking mensal requer histórico acumulado das coletas.";});
carregar();
</script>
</body></html>
